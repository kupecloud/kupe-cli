name: Main

# Release and publish only, behind one gates job: there is no branch
# protection, so `release: needs: gates` is the only guarantee that a
# released tree passed every check (kupecloud/github-workflows#14).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yaml
    with:
      pre-commit-args: --all-files --show-diff-on-failure --hook-stage manual

  release:
    needs:
      - gates
    uses: ./.github/workflows/semantic-release.yaml
    permissions:
      contents: write
      issues: write
      pull-requests: write

  # Goreleaser runs AFTER semantic-release and appends artifacts (archives,
  # checksums, SBOMs, Cosign signatures) to the release it just created.
  # Conditional on new_release_published so non-release commits skip this
  # entirely.
  publish:
    needs:
      - release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
