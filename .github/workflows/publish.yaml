name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: Semantic-release version without the leading v (e.g. "0.1.0").
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
      SCOOP_BUCKET_TOKEN:
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    name: Attach release artifacts
    runs-on: ubuntu-latest
    env:
      GORELEASER_VERSION: v2.15.2
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@67a64c6b92906324e21ac01a32d3f12b49097f52 # v0.17.9

      - name: Install GoReleaser
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        # release.mode: append in .goreleaser.yaml tells goreleaser to upload
        # artifacts into the GitHub release that semantic-release already
        # created, rather than creating a new (conflicting) release.
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
