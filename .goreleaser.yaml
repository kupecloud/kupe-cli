version: 2

# project_name drives artifact naming, the Homebrew formula / Scoop manifest
# filenames, and the `bin.install` line inside the generated formula. Use
# the same short name users will type (`brew install kupecloud/tap/kupe`)
# rather than the repo name (`kupe-cli`).
project_name: kupe

before:
  hooks:
    - go mod vendor
    - go test ./...
    # Generate shell completions and man(1) pages into ./completions/ and
    # ./manpages/ before archives so they're picked up by archives.files
    # and consumed by the homebrew_casks `completions:` / `manpages:`
    # stanzas. See scripts/completions-and-manpages.sh for the layout
    # (mirrors goreleaser/goreleaser's own pattern).
    - ./scripts/completions-and-manpages.sh

builds:
  - id: kupe
    main: ./cmd/kupe
    binary: kupe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X github.com/kupecloud/kupe-cli/internal/build.Version={{.Version}}
      - -X github.com/kupecloud/kupe-cli/internal/build.Commit={{.ShortCommit}}
      - -X github.com/kupecloud/kupe-cli/internal/build.Date={{.CommitDate}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kupe
    name_template: "kupe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - completions/*
      - manpages/*

checksum:
  name_template: "kupe_{{ .Version }}_checksums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"

# Homebrew Cask (cross-platform). Casks now support Linux via `on_linux`
# blocks (proven by goreleaser's own tap), and the legacy `brews:` config
# was deprecated in goreleaser v2.10 in favour of `homebrew_casks:`. The
# generated cask works on macOS (intel + arm) and Linux (intel + arm).
#
# Completions and manpages are generated by the before-hook script and
# shipped inside each archive at the paths listed below; the cask DSL
# handles installing them to the right Homebrew Cellar/Caskroom location.
homebrew_casks:
  - repository:
      owner: kupecloud
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Trailing slash matters: brew audit's HomepageUrlStyling rule rejects
    # bare-domain homepages (e.g. https://kupe.cloud) — must be an absolute
    # path including at least the slash.
    homepage: "https://kupe.cloud/"
    description: "Official CLI for Kupe Cloud"
    license: "Apache-2.0"
    commit_author:
      name: kupecloud-bot
      email: bot@kupe.cloud
    binaries:
      - kupe
    # macOS Gatekeeper workaround for unsigned binaries. Homebrew downloads
    # the cask tarball via curl, which sets com.apple.quarantine on the
    # extracted file → "could not verify is free of malware" dialog on
    # first run. Stripping the xattr post-install bypasses the dialog
    # without code signing. Remove this block once we add Apple Developer
    # ID notarization via the top-level `notarize:` config.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kupe"]
          end
    # Only the root manpage is referenced — the archive ships the full
    # per-subcommand tree for distro packagers (deb/rpm) but Homebrew
    # users get `man kupe` for the top-level help, then `kupe foo --help`
    # at runtime for everything else.
    manpages:
      - "manpages/kupe.1.gz"
    completions:
      bash: "completions/kupe.bash"
      zsh: "completions/kupe.zsh"
      fish: "completions/kupe.fish"
    # `verified:` is Homebrew's anti-typosquat attestation — the URL
    # prefix the cask is allowed to download from. Required for `brew
    # audit --strict` to pass.
    url:
      verified: github.com/kupecloud/kupe-cli/releases/download

scoops:
  - repository:
      owner: kupecloud
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://kupe.cloud"
    description: "Official CLI for Kupe Cloud"
    license: Apache-2.0
    commit_author:
      name: kupecloud-bot
      email: bot@kupe.cloud

release:
  github:
    owner: kupecloud
    name: kupe-cli
  # semantic-release (run earlier in the main.yaml pipeline) already creates
  # the GitHub Release with a conventional-commits changelog. Goreleaser's
  # job is to ATTACH artifacts to that release — not to replace it. "append"
  # uploads archives/checksums/SBOMs without touching the release body or
  # title. Change to "create" (default) only if the release is cut manually
  # and semantic-release is bypassed.
  mode: append
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    brew tap kupecloud/tap
    brew install kupe
    # or, one-liner:
    curl -fsSL https://get.kupe.cloud | sh
    ```

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "^style:"
