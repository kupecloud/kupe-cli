version: 2

# project_name drives artifact naming, the Homebrew formula / Scoop manifest
# filenames, and the `bin.install` line inside the generated formula. Use
# the same short name users will type (`brew install kupecloud/tap/kupe`)
# rather than the repo name (`kupe-cli`).
project_name: kupe

before:
  hooks:
    - go mod vendor
    - go test ./...
    # Generate man pages BEFORE the cross-platform builds run so they're
    # available for archives.files. `kupe man` is a hidden subcommand that
    # walks the cobra tree and emits man(1) into man/man1/. Distro packagers
    # (Homebrew/.deb/.rpm) install these from the archive.
    - mkdir -p man/man1
    - go run -mod=vendor ./cmd/kupe man man/man1

builds:
  - id: kupe
    main: ./cmd/kupe
    binary: kupe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X github.com/kupecloud/kupe-cli/internal/build.Version={{.Version}}
      - -X github.com/kupecloud/kupe-cli/internal/build.Commit={{.ShortCommit}}
      - -X github.com/kupecloud/kupe-cli/internal/build.Date={{.CommitDate}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kupe
    name_template: "kupe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - src: man/man1/*.1
        dst: man/man1
        strip_parent: true

checksum:
  name_template: "kupe_{{ .Version }}_checksums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"

# Homebrew formula (NOT cask). A formula installs on macOS *and* Linux Homebrew;
# a cask is macOS-only and historically for GUI apps. Cobra-style CLIs ship
# as formulae. `generate_completions_from_executable` runs the installed
# binary at brew-install time to emit shell completions for bash/zsh/fish —
# that avoids having to ship the completion files in the archive.
#
# (Goreleaser v2 keeps the legacy key `brews:` for formulae; only casks got
# the `homebrew_*` prefix.)
brews:
  - repository:
      owner: kupecloud
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://kupe.cloud"
    description: "Official CLI for Kupe managed Kubernetes clusters"
    license: "Apache-2.0"
    commit_author:
      name: kupecloud-bot
      email: bot@kupe.cloud
    install: |
      bin.install "kupe"
      generate_completions_from_executable(bin/"kupe", "completion")
      man1.install Dir["man/man1/*.1"]
    test: |
      assert_match "kupe version", shell_output("#{bin}/kupe version")

scoops:
  - repository:
      owner: kupecloud
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://kupe.cloud"
    description: "Official CLI for Kupe managed Kubernetes clusters"
    license: Apache-2.0
    commit_author:
      name: kupecloud-bot
      email: bot@kupe.cloud

release:
  github:
    owner: kupecloud
    name: kupe-cli
  # semantic-release (run earlier in the main.yaml pipeline) already creates
  # the GitHub Release with a conventional-commits changelog. Goreleaser's
  # job is to ATTACH artifacts to that release — not to replace it. "append"
  # uploads archives/checksums/SBOMs without touching the release body or
  # title. Change to "create" (default) only if the release is cut manually
  # and semantic-release is bypassed.
  mode: append
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    brew tap kupecloud/tap
    brew install kupe
    # or, one-liner:
    curl -fsSL https://get.kupe.cloud | sh
    ```

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "^style:"
