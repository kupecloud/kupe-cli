minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        exclude: ^vendor/
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: ^vendor/
      - id: end-of-file-fixer
        exclude: ^vendor/
      - id: trailing-whitespace
        exclude: ^vendor/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg

  - repo: https://github.com/trussworks/pre-commit-hooks
    rev: f72781be8d6b5e92653232bfb13f3f10cb1fc0c4
    hooks:
      - id: markdown-toc
        files: ^README\.md$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 3766ad839ad3a74558031510b3bc9872bb1d9980
    hooks:
      - id: markdownlint-cli2
        files: ^README\.md$

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
    hooks:
      - id: codespell
        args:
          - --write-changes
        exclude: ^(vendor/|go\.sum|coverage\.out|testdata/)

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: bash -c 'GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12'
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types:
          - go
        exclude: ^vendor/
      - id: govulncheck
        name: govulncheck
        entry: bash -c 'GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...'
        language: system
        pass_filenames: false
        files: ^(cmd/|internal/|test/|go\.mod|\.goreleaser\.yaml|Makefile)
      - id: gosec
        name: gosec
        entry: bash -c 'GOWORK=off go run github.com/securego/gosec/v2/cmd/gosec@v2.25.0 -exclude-generated ./...'
        language: system
        pass_filenames: false
        files: ^(cmd/|internal/|test/|go\.mod|\.goreleaser\.yaml|Makefile)
        # Slow (minutes): CI runs it on every PR (`--hook-stage manual`).
        stages:
          - manual

      # CI gates (kupecloud/github-workflows#14). The PR and main workflows run
      # `pre-commit run --all-files --hook-stage manual` as one job, so each
      # former CI job is a hook here. The slow ones are `manual`: a commit stays
      # fast; run them all locally with
      #   pre-commit run --all-files --hook-stage manual
      - id: golangci-lint
        name: golangci-lint
        # v2.1.6 is the version CI's go-lint.yaml job installed (its
        # golangci-version default; main run 39923837440 log), with the
        # repository's .golangci.yaml, so CI's result is unchanged. The old
        # hook pinned v2.11.4; bump this deliberately, in its own change.
        entry: bash -c 'GOWORK=off go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run --timeout=10m'
        language: system
        pass_filenames: false
        files: ^(.*\.go|go\.(mod|sum)|\.golangci\.yaml)$
        stages:
          - manual
      - id: go-version-drift
        name: go version drift (Dockerfile builder >= go.mod)
        # No Dockerfile today, so this no-ops, as the CI job did.
        entry: bash .github/hooks/go-version-drift.sh
        language: system
        pass_filenames: false
        files: ^(Dockerfile|go\.mod)$
      - id: go-unit-tests
        name: go vet + unit tests (race, coverage)
        entry: bash .github/hooks/go-unit-tests.sh
        language: system
        pass_filenames: false
        files: ^(.*\.go|go\.(mod|sum)|vendor/modules\.txt|.*/testdata/.*|\.github/hooks/go-unit-tests\.sh)$
        stages:
          - manual
      - id: go-mod-tidy
        name: go mod tidy
        entry: bash .github/hooks/go-mod-tidy.sh
        language: system
        pass_filenames: false
        files: ^(.*\.go|go\.(mod|sum)|\.github/hooks/go-mod-tidy\.sh)$
        stages:
          - manual
      # The live suite sits behind the `live` build tag, so `go vet ./...`
      # never compiles it. Compile only, never run (same as `make vet-live`).
      - id: go-vet-live
        name: go vet live suite (compile only)
        entry: bash -c 'GOWORK=off go vet -mod=vendor -tags=live ./test/live/...'
        language: system
        pass_filenames: false
        files: ^(.*\.go|go\.(mod|sum)|vendor/modules\.txt)$
        stages:
          - manual

  # Refuse any commit whose STAGED content contains a secret. Added org-wide on
  # 2026-10-06 after three OpenTofu state files carrying a dev SSH private key
  # and a live Cloudflare Access OAuth client secret were committed to
  # kupe-tests (99e0452) and sat in history for 34 days. gitleaks v8.30.1 flags
  # all of them, so this would have blocked that commit.
  #
  # Chosen over GitHub secret scanning because push protection needs the paid
  # Secret Protection product on private repos ($19/committer/month) and only
  # alerts AFTER the push; this refuses before the commit exists.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
